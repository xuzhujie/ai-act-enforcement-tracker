name: Refresh official source snapshot

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh official sources
        run: npm run refresh:data -- --allow-failures --retries 2 --retry-delay-ms 500
      - name: Validate refreshed snapshot
        run: npm run validate:data
      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/refresh-official-sources
          delete-branch: true
          commit-message: 'chore: refresh official source snapshot'
          title: 'chore: refresh official source snapshot'
          body: |
            Automated refresh of the official AI Act, AI Office, Member State market-surveillance, DMA, and DSA source snapshot.

            Review failed or stale source records before merging. This workflow does not add new enforcement matters automatically.
          add-paths: src/data/source-snapshot.json
